apiVersion: apps/v1
kind: Deployment
metadata:
  name: bravo-frontend
  namespace: bravo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bravo-frontend
  template:
    metadata:
      labels:
        app: bravo-frontend
    spec:
      containers:
        - name: bravo-frontend
          image: bravo-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: bravo-frontend-service
  namespace: bravo
spec:
  type: ClusterIP
  selector:
    app: bravo-frontend
  ports:
    - port: 80
      targetPort: 80
