<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bravo Applications</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="brand">Bravo Realtime</div>
    <div class="status" id="status">Desconectado</div>
  </header>

  <main>
    <section class="card">
      <h2>Auth</h2>
      <form id="register-form" class="grid">
        <label>Email<input name="email" type="email" required /></label>
        <label>Password<input name="password" type="password" required /></label>
        <label>País<input name="country" type="text" placeholder="MX" required /></label>
        <button type="submit">Registrar</button>
      </form>
      <form id="login-form" class="grid">
        <label>Email<input name="email" type="email" required /></label>
        <label>Password<input name="password" type="password" required /></label>
        <button type="submit">Login</button>
      </form>
      <div class="info" id="auth-info">Token: -</div>
      <label>Base URL<input id="base-url" type="text" value="http://localhost:8080" /></label>
    </section>

    <section class="card">
      <h2>Crear solicitud</h2>
      <form id="create-form" class="grid">
        <label>País<input name="country" placeholder="MX" required /></label>
        <label>Nombre completo<input name="full_name" required /></label>
        <label>Documento<input name="identity_document" required /></label>
        <label>Ingreso mensual<input name="monthly_income" type="number" required /></label>
        <label>Monto solicitado<input name="requested_amount" type="number" required /></label>
        <button type="submit">Crear</button>
      </form>
    </section>

    <section class="card">
      <h2>Listado</h2>
      <form id="filters" class="grid">
        <label>País<input name="country" placeholder="MX" /></label>
        <label>Estado<input name="status" placeholder="PENDING" /></label>
        <label>From<input name="from_date" type="date" /></label>
        <label>To<input name="to_date" type="date" /></label>
        <label>Límite<input name="limit" type="number" value="20" /></label>
        <label>Offset<input name="offset" type="number" value="0" /></label>
        <button type="submit">Aplicar filtros</button>
      </form>
      <div id="list"></div>
    </section>

    <section class="card">
      <h2>Detalle / Actualizar estado</h2>
      <div id="detail">Selecciona una solicitud</div>
      <form id="status-form" class="grid">
        <label>ID<input name="id" required /></label>
        <label>Nuevo estado
          <select name="status">
            <option value="PENDING">PENDING</option>
            <option value="VALIDATING">VALIDATING</option>
            <option value="APPROVED">APPROVED</option>
            <option value="DENIED">DENIED</option>
          </select>
        </label>
        <label>Notas<textarea name="notes" rows="2"></textarea></label>
        <button type="submit">Actualizar</button>
      </form>
    </section>

    <section class="card">
      <h2>Eventos en tiempo real</h2>
      <div id="events" class="events"></div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
