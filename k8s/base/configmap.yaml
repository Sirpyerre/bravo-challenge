apiVersion: v1
kind: ConfigMap
metadata:
  name: bravo-config
  namespace: bravo
data:
  PORT: "8000"
  ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  FRONTEND_URL: "http://localhost:3000"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"

  # Database
  POSTGRES_SERVER: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "bravo"

  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"

  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # Bank providers (WireMock interno)
  MX_BANK_URL: "http://wiremock-service:8080/mx"
  BR_BANK_URL: "http://wiremock-service:8080/br"
  ESP_BANK_URL: "http://wiremock-service:8080/esp"
  PT_BANK_URL: "http://wiremock-service:8080/pt"
  IT_BANK_URL: "http://wiremock-service:8080/it"
  CO_BANK_URL: "http://wiremock-service:8080/co"

  # Application
  IDEMPOTENCY_TTL: "24h"
  REQUEST_TIMEOUT: "30s"
  MAX_RETRIES: "3"
