# Valores sensibles. En producción usar un gestor de secretos (Vault, Sealed Secrets, etc.)
# Los valores en stringData se almacenan como base64 automáticamente por K8s.
apiVersion: v1
kind: Secret
metadata:
  name: bravo-secret
  namespace: bravo
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_USER: "postgres"
  JWT_SECRET: "change-me-in-production-min-32-chars"
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  REDIS_PASSWORD: ""
